<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B08D57"/>
    </marker>
  </defs>

  <rect width="1280" height="660" fill="#FFFFFF"/>

  <text x="40" y="48" font-size="22" font-weight="700" fill="#111111">SpreadBliss Collaboration Intelligence — architecture</text>
  <text x="40" y="74" font-size="14" fill="#555555">Thin Next.js chat front door to an existing n8n multi-agent workflow that returns up to three verified collaboration recommendations</text>

  <!-- Zone: this repository -->
  <rect x="40" y="110" width="600" height="250" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="56" y="136" font-size="13" font-weight="600" fill="#2563EB">THIS REPOSITORY (Next.js 16, Vercel)</text>

  <!-- Browser -->
  <rect x="60" y="180" width="160" height="110" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <text x="140" y="222" font-size="16" font-weight="600" fill="#111111" text-anchor="middle">Browser</text>
  <text x="140" y="246" font-size="12" fill="#555555" text-anchor="middle">Chat UI (React)</text>
  <text x="140" y="264" font-size="12" fill="#555555" text-anchor="middle">sessionId · sessionStorage</text>

  <!-- API route -->
  <rect x="280" y="180" width="180" height="110" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <text x="370" y="216" font-size="16" font-weight="600" fill="#111111" text-anchor="middle">Route Handler</text>
  <text x="370" y="238" font-size="13" fill="#2563EB" text-anchor="middle" font-family="Menlo, Consolas, monospace">POST /api/chat</text>
  <text x="370" y="258" font-size="12" fill="#555555" text-anchor="middle">validate · timeout</text>
  <text x="370" y="275" font-size="12" fill="#555555" text-anchor="middle">normalize · error mapping</text>

  <!-- Server-only env -->
  <rect x="490" y="200" width="130" height="70" rx="6" fill="#F8F5EF" stroke="#B08D57" stroke-width="1.5"/>
  <text x="555" y="228" font-size="12" font-weight="600" fill="#111111" text-anchor="middle">Server-only env</text>
  <text x="555" y="248" font-size="10.5" fill="#555555" text-anchor="middle" font-family="Menlo, Consolas, monospace">N8N_CHAT_WEBHOOK_URL</text>

  <!-- Arrows: browser <-> api -->
  <line x1="220" y1="222" x2="280" y2="222" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="280" y1="252" x2="220" y2="252" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250" y="212" font-size="10" fill="#2563EB" text-anchor="middle">message</text>
  <text x="250" y="268" font-size="10" fill="#555555" text-anchor="middle">response</text>
  <line x1="490" y1="235" x2="460" y2="235" stroke="#B08D57" stroke-width="1.5" marker-end="url(#arrow-gold)"/>

  <!-- Zone: n8n -->
  <rect x="700" y="110" width="540" height="510" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="716" y="136" font-size="13" font-weight="600" fill="#111111">EXISTING n8n WORKFLOWS (not modified by this repository)</text>

  <!-- Chat Trigger -->
  <rect x="740" y="160" width="460" height="56" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <text x="970" y="184" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">Chat Trigger (webhook)</text>
  <text x="970" y="204" font-size="11.5" fill="#555555" text-anchor="middle">{ action, sessionId, chatInput } → { output: Markdown report }</text>

  <!-- Orchestrator -->
  <rect x="740" y="248" width="320" height="86" rx="6" fill="#111111" stroke="#111111"/>
  <text x="900" y="276" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">00 Collaboration Orchestrator</text>
  <text x="900" y="296" font-size="11.5" fill="#DDDDDD" text-anchor="middle">extracts org, goal, geography, programs, population</text>
  <text x="900" y="312" font-size="11.5" fill="#DDDDDD" text-anchor="middle">research → evaluate → verify per candidate · ranks ≤ 3</text>

  <!-- Memory -->
  <rect x="1080" y="256" width="120" height="70" rx="6" fill="#F8F5EF" stroke="#B08D57" stroke-width="1.5"/>
  <text x="1140" y="285" font-size="12" font-weight="600" fill="#111111" text-anchor="middle">Simple Memory</text>
  <text x="1140" y="303" font-size="11" fill="#555555" text-anchor="middle">keyed by sessionId</text>
  <line x1="1060" y1="291" x2="1080" y2="291" stroke="#B08D57" stroke-width="1.5" marker-end="url(#arrow-gold)" marker-start="url(#arrow-gold)"/>

  <!-- Trigger <-> orchestrator -->
  <line x1="900" y1="216" x2="900" y2="248" stroke="#111111" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

  <!-- Subworkflows -->
  <line x1="900" y1="334" x2="900" y2="366" stroke="#111111" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="920" y="356" font-size="10.5" fill="#555555">subworkflow tools</text>
  <g font-size="11" fill="#111111" text-anchor="middle">
    <rect x="740" y="366" width="84" height="96" rx="6" fill="#FFFFFF" stroke="#B08D57" stroke-width="1.5"/>
    <text x="782" y="386" font-weight="700">01</text>
    <text x="782" y="404">Organization</text><text x="782" y="419">Context</text>
    <text x="782" y="442" font-size="9.5" fill="#555555">profile lookup</text>

    <rect x="834" y="366" width="84" height="96" rx="6" fill="#FFFFFF" stroke="#B08D57" stroke-width="1.5"/>
    <text x="876" y="386" font-weight="700">02</text>
    <text x="876" y="404">Candidate</text><text x="876" y="419">Discovery</text>
    <text x="876" y="442" font-size="9.5" fill="#555555">partner pool</text>

    <rect x="928" y="366" width="84" height="96" rx="6" fill="#FFFFFF" stroke="#B08D57" stroke-width="1.5"/>
    <text x="970" y="386" font-weight="700">03</text>
    <text x="970" y="404">Candidate</text><text x="970" y="419">Research</text>
    <text x="970" y="442" font-size="9.5" fill="#555555">one at a time</text>

    <rect x="1022" y="366" width="84" height="96" rx="6" fill="#FFFFFF" stroke="#B08D57" stroke-width="1.5"/>
    <text x="1064" y="386" font-weight="700">04</text>
    <text x="1064" y="404">Collaboration</text><text x="1064" y="419">Evaluator</text>
    <text x="1064" y="442" font-size="9.5" fill="#555555">6 scores, weighted</text>

    <rect x="1116" y="366" width="84" height="96" rx="6" fill="#FFFFFF" stroke="#B08D57" stroke-width="1.5"/>
    <text x="1158" y="386" font-weight="700">05</text>
    <text x="1158" y="404">Evidence</text><text x="1158" y="419">Verifier</text>
    <text x="1158" y="442" font-size="9.5" fill="#555555">supported? gaps</text>
  </g>

  <!-- Data sources -->
  <rect x="740" y="520" width="200" height="60" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <text x="840" y="545" font-size="12" font-weight="600" fill="#111111" text-anchor="middle">SpreadBliss Google Sheet</text>
  <text x="840" y="563" font-size="11" fill="#555555" text-anchor="middle">nonprofit profiles</text>
  <rect x="1000" y="520" width="200" height="60" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <text x="1100" y="545" font-size="12" font-weight="600" fill="#111111" text-anchor="middle">You.com web search</text>
  <text x="1100" y="563" font-size="11" fill="#555555" text-anchor="middle">public evidence</text>
  <!-- 01, 02 -> sheet -->
  <line x1="782" y1="462" x2="800" y2="520" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="876" y1="462" x2="860" y2="520" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- 02, 03 -> you.com -->
  <line x1="890" y1="462" x2="1040" y2="520" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="970" y1="462" x2="1080" y2="520" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="970" y="605" font-size="11" fill="#555555" text-anchor="middle">04 and 05 use only the supplied profiles, research packet and evidence — no new lookups</text>

  <!-- api -> trigger -->
  <path d="M 460 200 L 470 200 L 470 150 L 680 150 L 680 188 L 740 188" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="570" y="142" font-size="10" fill="#2563EB" text-anchor="middle">HTTPS POST (server only)</text>
  <path d="M 740 204 L 680 204 L 680 330 L 470 330 L 470 285 L 460 285" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="575" y="345" font-size="10" fill="#555555" text-anchor="middle">{ output: string } → normalized ChatResponse</text>

  <!-- Footnote -->
  <text x="40" y="400" font-size="12" fill="#555555">Boundary rules</text>
  <text x="40" y="422" font-size="12" fill="#111111">• The webhook URL and optional Basic-auth values live only on the server; the browser never sees them.</text>
  <text x="40" y="442" font-size="12" fill="#111111">• The browser receives only a validated ChatResponse; Markdown is rendered without raw HTML, links are http(s)-only.</text>
  <text x="40" y="462" font-size="12" fill="#111111">• Lookup, discovery, research, scoring and verification are separate n8n agents, so no single agent can</text>
  <text x="40" y="480" font-size="12" fill="#111111">   invent a candidate, score it and approve its own recommendation. This repository never reimplements them.</text>
  <text x="40" y="500" font-size="12" fill="#111111">• One conversation = one opaque sessionId; New conversation starts a fresh session and fresh n8n memory.</text>
  <text x="40" y="520" font-size="12" fill="#111111">• No outbound outreach or contact tool is connected anywhere in the system.</text>

  <text x="40" y="560" font-size="12" fill="#555555">Scoring weights (04)</text>
  <text x="40" y="580" font-size="12" fill="#111111">Program complementarity 25% · Mission alignment 20% · Geographic alignment 15%</text>
  <text x="40" y="598" font-size="12" fill="#111111">Population alignment 15% · Collaboration opportunity 15% · Evidence quality 10%</text>

  <text x="40" y="640" font-size="11" fill="#B08D57">Black #111111 · Electric Blue #2563EB · Brass Gold #B08D57</text>
</svg>
